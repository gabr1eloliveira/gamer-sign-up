<!DOCTYPE html>
<html lang="pt-bt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="assets/images/favicon-32x32.png" type="image/x-icon">
    <link rel="stylesheet" href="src/css/resete.css">
    <link rel="stylesheet" href="src/css/global.css">
    <link rel="stylesheet" href="src/css/style.css">
    <title>Document</title>
</head>
<body>
    <header class="cabecalho">
        <div class="navbar">
            <div class="logo">
                <img src="assets/images/logo.svg" alt="Logo da Empresa">
            </div>
            <p class="staps-sing-up">0/5 READY</p>
        </div>
    </header>
    
    <main class="container">
        <section class="cadastro">
            <div class="cadastro__conteudo">
                <h1 class="cadastro-conteudo__titulo"><span>//</span>JUNTE-SE A NEXUS</h1>
                <p class="cadastro-conteudo__subtitulo">INICIALIZE SUA IDENTIDADE NEONCORE</p>
                <div class="linha-cadastro-conteudo"></div>
                <div class="cadastro__operador">
                    <p class="operador__id">ID DO OPERADOR</p>
                    <p class="operador-id__name">NÃO ATRIBUIDO</p>
                </div>
                <div class="cadastro__form">
                    <div class="cadastro-form__new-operator">
                        <p class="new-operator">NOVO OPERADOR</p>
                        <p class="new-operator__all-required">ALL REQUIRED</p>                    
                    </div>
                    <div class="linha-cadastro-conteudo"></div>
                    <form action="" method="post" class="formulario-cadastro">

                        <label for="username"><span>></span> USERNAME</label>
                        <input type="text" name="username" id="cadastro-form__username" class="cadastro-form__input" required minlength="3" maxlength="20" placeholder="e.g. Vortex_07">
                        <p class="cadastro-form__description">3-20 caracteres: letras, números, _ ou -</p>

                        <label for="email"><span>></span> EMAIL</label>
                        <input type="email" name="email" id="cadastro-form__email" class="cadastro-form__input" required maxlength="100" autocomplete="email" placeholder="you@example.com">
                        <p class="cadastro-form__description">3-20 caracteres: letras, números, _ ou -</p>

                        <label for="senha"><span>></span> SENHA</label>
                        <div class="cadastro-form__campo-senha">                            
                            <input type="password" name="senha" id="cadastro-form__senha" class="cadastro-form__input" required minlength="8">
                            <button class="btn-mostrar-senha">
                                <img src="assets/images/icon-eye.svg" alt="Mostrar Senha">
                            </button>
                            <div class="cadastro-form__forca-senha">
                                <span class="forca-senha__nivel"></span>
                                <span class="forca-senha__nivel"></span>
                                <span class="forca-senha__nivel"></span>
                                <span class="forca-senha__nivel"></span>
                            </div>                           
                        </div>
                        <p class="cadastro-form__description">Pelo menos 8 caracterers</p>

                        <label for="confirma-senha"><span>></span> CONFIRMAR SENHA</label>
                        <div class="cadastro-form__campo-senha">                           
                            <input type="password" name="confirma-senha " id="cadastro-form__confirma-senha" class="cadastro-form__input" required>
                            <button class="btn-mostrar-senha">
                                <img src="assets/images/icon-eye.svg" alt="Mostrar Senha">
                            </button>
                        </div>

                        <div class="cadastrar-form__aceite-termos">
                            <input type="checkbox" name="termos" id="cadastro-form__termos" class="cadastro-form__input" required>
                            <label for="termos">
                                Aceito os <a href="#" target="_blank">Termos</a> e a <a href="#" target="_blank">Política de Privacidade.</a>
                            </label>
                        </div>
                        <button class="btn-inicializar-conta">INICIALIZAR CONTA</button>
                        <p class="cadastrar-form__already-login">Já e um operador? <a href="#" target="_blank">Login</a></p>
                    </form>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
